<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>두벌식</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="container">
            <div id="field">
                <label class="toggle" title="Toggle Korean input override">
                    <input type="checkbox" id="ime-toggle" checked />
                    <span class="track"><span class="thumb"></span></span>
                    <span class="toggle-label">한글 입력</span>
                </label>
                <!-- biome-ignore lint/a11y/useSemanticElements: <input> can't style the sub-range; we need contenteditable for the IME underline. -->
                <div id="input" contenteditable="true" role="textbox" tabindex="0" aria-multiline="false" aria-label="Korean input" spellcheck="false"></div>
            </div>
            <div id="keyboard"></div>
        </div>
    </body>
</html>
